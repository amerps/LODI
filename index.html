<style>
:root{--brand:#653332;--gold:#c08a3e;--paper:#f7efe3;--bg:#f2e8d9;--card:#fffaf2;--ink:#2b1a19;--muted:#7d6461;--line:#e3d3bd;--chip:#ead9c2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1211;--card:#2a1b19;--ink:#f3e6d6;--muted:#b9a08b;--line:#43302c;--chip:#3a2724;--brand:#e0a590;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1211;--card:#2a1b19;--ink:#f3e6d6;--muted:#b9a08b;--line:#43302c;--chip:#3a2724;--brand:#e0a590;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 118px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "DM Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
header{background:var(--paper);text-align:center;padding:26px 16px 22px;border-bottom:3px solid var(--brand);position:relative}
header::after{content:"♠  ♥  ♣  ♦";position:absolute;left:0;right:0;bottom:-15px;color:var(--gold);letter-spacing:.5em;font-size:13px;background:var(--bg);width:190px;margin:auto;padding:0 6px;line-height:26px}
header img{width:min(340px,80vw);height:auto;display:block;margin:0 auto}
header p{margin:6px 0 0;color:#7d5d58;font:600 12px "DM Sans";letter-spacing:.28em;text-transform:uppercase}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:24px 14px 6px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;max-width:760px;margin:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;background:var(--chip);color:var(--ink);font:500 14px "DM Sans";padding:8px 14px;cursor:pointer;white-space:nowrap}
.chip[aria-current="true"]{background:var(--brand);color:#fff6ea}
:root[data-theme="dark"] .chip[aria-current="true"]{color:#2b1a19}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-current="true"]{color:#2b1a19}}
main{max-width:760px;margin:0 auto;padding:12px 14px 40px}
section{margin-top:26px}
section:last-of-type{min-height:calc(100vh - 150px)}
h2{font:700 26px/1.1 Fraunces,Georgia,serif;color:var(--brand);margin:0 0 12px;display:flex;align-items:center;gap:10px}
h2 small{font:500 13px "DM Sans";color:var(--muted)}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
li{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:13px 16px}
li+li{border-top:1px dashed var(--line)}
.n{font-weight:500}.n em{display:block;font-style:normal;font-size:13px;color:var(--muted);font-weight:400;margin-top:1px}
.p{font:700 16px "DM Sans";color:var(--brand);white-space:nowrap}.p small{font-weight:500;color:var(--muted);font-size:11px;margin-left:3px}
.empty{text-align:center;color:var(--muted);padding:50px 0}
footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 16px 36px}
@media (min-width:700px){li{padding:15px 22px}h2{font-size:30px}}

s","items":[["Waffles (Nutella / Lotus / Pistachio / White / Dark / Caramel)",85],["Waffles Four Seasons (4 Sauces)",100],["Molten Cake",75],["Ice Cream Add-on",10],["Cheesecake",85],["Tiramisu",90],["Brownies",65],["Cookies Plain / Classic Double Shot / Red Velvet",70],["Cookies with Cream",130]]},{"cat":"Sandwiches","items":[["Pastrami, Sausage & Roumy Cheese Sandwich",45],["Flamingo & Cherry Sandwich",45],["Cheddar, Smoked Turkey & Mayonnaise Sandwich",45],["Luncheon, Cheddar, Ketchup & Mayonnaise Sandwich",45],["Turkey, Luncheon & Roumy Cheese Sandwich",45],["Cheddar & Roumy Cheese Sandwich",45]]},{"cat":"Croissants","items":[["Plain Croissant",50],["Sweet Stuffed Croissant",65],["Savory Croissant",75]]},{"cat":"Hot Chocolate","items":[["Dark Hot Chocolate",75],["White Hot Chocolate",75],["Oreo Hot Chocolate",75],["KitKat Berry Hot Chocolate",75],["Coconut Hot Chocolate",75],["Nutella Hot Chocolate",75]]},{"cat":"Iced Coffee","items":[["Iced Latte",50],["Iced Cappuccino",60],["Iced Caramel Macchiato",70],["Iced Coffee Frappé (Classic)",60],["Flavored Iced Coffee Frappé (Caramel / Hazelnut / Vanilla)",75],["Iced Mocha Frappé (Dark / White / Nutella / Lotus)",70],["Iced Coconut Coffee",70],["Iced Cinnabon Coffee",70]]}];
const svg = (body) => `<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
const GLASS = '<path d="M6 8h12l-1.4 11.5a1.5 1.5 0 0 1-1.5 1.3H8.9a1.5 1.5 0 0 1-1.5-1.3z"/>';
const MUG = '<path d="M5 10h10v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M15 12h2a2 2 0 0 1 0 4h-2"/>';
const ICONS = {
  "Specialty Coffee": svg('<path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M9 3c-1 1.2 1 2 0 3.2M13 3c-1 1.2 1 2 0 3.2"/>'),
  "Classic Coffee": svg('<path d="M6 10h9v3a4.5 4.5 0 0 1-9 0z"/><path d="M15 11h1.2a2 2 0 0 1 0 4H15"/><path d="M4 20h13"/><path d="M9 4c-1 1 1 1.800 0 3M12 4c-1 1 1 1.800 0 3"/>'),

  "Cans & Soft Drinks": svg('<path d="M7 5h10v14a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 19z"/><path d="M7 8.5h10M7 15.5h10"/><path d="M10.500 12h3"/>'),
  "Fresh Juices": svg(GLASS + '<path d="M14 8l1.800-5"/><circle cx="17.500" cy="7" r="2.200"/>'),
  "Smoothies": svg('<path d="M7 8h10l-1.200 12a1 1 0 0 1-1 .9H9.200a1 1 0 0 1-1-.9z"/><path d="M6 8h12M12 8V3h3"/><path d="M8.500 13c1.200-1 2.300 1 3.500 0s2.300 1 3.500 0"/>'),
  "Mojitos": svg('<path d="M7 6h10l-1.300 14H8.300z"/><path d="M8.500 11h7"/><path d="M12 6c0-2 1.500-3 3.500-3 0 2-1.500 3-3.500 3z"/>'),
  "Boba Drinks": svg('<path d="M7 9h10l-1.200 11a1 1 0 0 1-1 .9H9.200a1 1 0 0 1-1-.9z"/><path d="M6.500 9a5.500 5 0 0 1 11 0"/><path d="M13 7.500L14.500 2.500"/><circle cx="10" cy="18" r=".9"/><circle cx="12.500" cy="18.300" r=".9"/><circle cx="15" cy="18" r=".9"/>'),
  "Desserts": svg('<path d="M6 12h12l-1.500 8h-9z"/><path d="M6 12a6 6 0 0 1 12 0"/><circle cx="12" cy="4.500" r="1"/>'),
  "Sandwiches": svg('<path d="M4 10a8 5 0 0 1 16 0z"/><path d="M4 13.500l2 1.500 2-1.500 2 1.500 2-1.500 2 1.500 2-1.500 2 1.500 2-1.500"/><path d="M5 17.500h14l-.5 1a2 2 0 0 1-2 1.500h-9a2 2 0 0 1-2-1.500z"/>'),
  "Croissants": svg('<path d="M3 16a9 8 0 0 1 18 0"/><path d="M7 16l1.500-6M12 16V8.500M17 16l-1.500-6"/><path d="M3 16c2 1.500 4 1.500 6 0 2 1.500 4 1.500 6 0 2 1.500 4 1.500 6 0"/>'),

  "Iced Coffee": svg(GLASS + '<path d="M14 8l1.800-5"/><rect x="9" y="11" width="3.500" height="3.500" rx=".6" transform="rotate(-12 10.700 12.700)"/><rect x="12.600" y="14.500" width="3" height="3" rx=".6"/>')
};
const $ = (s) => document.querySelector(s);
const menuEl = $("#menu"), chipsEl = $("#chips");

/** Splits "Name (details)" into a title and an optional detail line. */
const splitName = (raw) => {
  const m = /^(.*?)\s*\((.*)\)\s*$/.exec(raw);
  return m ? { title: m[1], detail: m[2] } : { title: raw, detail: null };
};
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const slug = (s) => "c-" + s.toLowerCase().replace(/[^a-z0-9]+/g, "-");

function renderItem([name, price]) {
  const { title, detail } = splitName(name);
  const p = price == null ? `<span class="p"><small>Ask us</small></span>` : `<span class="p">${price}<small>EGP</small></span>`;
  return `<li><span class="n">${esc(title)}${detail ? `<em>${esc(detail)}</em>` : ""}</span>${p}</li>`;
}

function render(query = "") {
  const q = query.trim().toLowerCase();
  const groups = MENU
    .map((g) => ({ ...g, items: q ? g.items.filter(([n]) => n.toLowerCase().includes(q) || g.cat.toLowerCase().includes(q)) : g.items }))
    .filter((g) => g.items.length);
  menuEl.innerHTML = groups.length
    ? groups.map((g) => `<section id="${slug(g.cat)}"><h2><span aria-hidden="true">${ICONS[g.cat] ?? "•"}</span>${esc(g.cat)}</h2><ul>${g.items.map(renderItem).join("")}</ul></section>`).join("")
    : `<p class="empty">Nothing matches “${esc(query)}”.</p>`;
  chipsEl.innerHTML = groups.map((g, i) => `<button class="chip" data-id="${slug(g.cat)}" aria-current="${i === 0}">${esc(g.cat)}</button>`).join("");
  observe();
}

const bar = $(".bar");
let active = null, lock = 0, ticking = false;
const barBottom = () => bar.getBoundingClientRect().bottom;

/** Highlights one chip and centers it inside the chip row only (never moves the page). */
function setActive(id) {
  chipsEl.querySelectorAll(".chip").forEach((c) => {
    const on = c.dataset.id === id;
    c.setAttribute("aria-current", on);
    if (on) {
      const left = chipsEl.scrollLeft + c.getBoundingClientRect().left - chipsEl.getBoundingClientRect().left - (chipsEl.clientWidth - c.offsetWidth) / 2;
      chipsEl.scrollTo({ left, behavior: "smooth" });
    }
  });
}

/** The active section is the last one whose top has passed just under the sticky bar. */
function update() {
  ticking = false;
  if (performance.now() < lock) return;
  const secs = [...menuEl.querySelectorAll("section")];
  if (!secs.length) return;
  const line = barBottom() + 24;
  let cur = secs[0];
  for (const s of secs) if (s.getBoundingClientRect().top <= line) cur = s;
  if (cur.id !== active) { active = cur.id; setActive(active); }
}

function observe() { active = null; update(); }

chipsEl.addEventListener("click", (e) => {
  const id = e.target.closest(".chip")?.dataset.id;
  const el = id && document.getElementById(id);
  if (!el) return;
  const y = scrollY + el.getBoundingClientRect().top - barBottom() - 12;
  lock = performance.now() + 900;
  active = id;
  setActive(id);
  scrollTo({ top: Math.max(0, y), behavior: "smooth" });
});
addEventListener("scroll", () => {
  if (!ticking) { ticking = true; requestAnimationFrame(update); }
}, { passive: true });
render();
